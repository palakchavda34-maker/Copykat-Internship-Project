{% extends 'base.html' %}
{% load static %}

{% block title %}Student Registration | Internship Portal{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card" style="max-width: 480px;">
        <div class="auth-header">
            <div style="width: 50px; height: 50px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; font-size: 1.5rem;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Create Student Account</h1>
            <p>Join thousands of students applying for internships</p>
        </div>

        <form id="student-register-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="e.g. Aarav Sharma" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="aarav@example.com" required>
            </div>

            <div class="form-group">
                <label for="college">University / College</label>
                <input type="text" id="college" class="form-control" placeholder="e.g. Nirma University" required>
            </div>

            <div class="form-group">
                <label for="password">Password (min. 6 characters)</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="reg-submit-btn">
                <i class="fa-solid fa-user-plus"></i> Register as Student
            </button>
        </form>

        <div class="form-footer">
            Already registered? <a href="/student/login/">Login here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('student-register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reg-submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registering...';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const college = document.getElementById('college').value.trim();
    const password = document.getElementById('password').value;

    const res = await apiRequest('/api/students/register/', {
        method: 'POST',
        body: JSON.stringify({ name, email, college, password })
    });

    if (res.ok) {
        showToast('Registration successful! Redirecting to dashboard...', 'success');
        Auth.setUser(res.data.student, 'student', res.data.tokens);
        setTimeout(() => {
            window.location.href = '/student/dashboard/';
        }, 800);
    } else {
        let msg = 'Registration failed.';
        if (res.data.email) msg = 'Email: ' + res.data.email[0];
        else if (res.data.password) msg = 'Password: ' + res.data.password[0];
        else if (typeof res.data === 'object') msg = Object.values(res.data)[0];

        showToast(msg, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Register as Student';
    }
});
</script>
{% endblock %}
